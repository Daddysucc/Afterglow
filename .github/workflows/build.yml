name: build

# Tests run on every push and pull request. Pushing a version tag (e.g. 3.0.0 or v3.0.0) also
# builds the installer and the portable executable, and publishes them as a GitHub release.
# Only the built-in GitHub token is used, so no secrets need to be set up.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # The tests use Windows APIs (e.g. the registry)
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # Release builds also verify formatting, and treat warnings as errors
      - name: Build
        run: dotnet build --configuration Release

      # Failed tests are listed by name in the run's summary
      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger GitHubActions

  pack:
    # Packages are only built for version tags, or when run manually
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

    needs: test

    strategy:
      matrix:
        rid:
          - win-x64
          - win-arm64
          - win-x86

    # Needs to run on Windows to create the installer
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # Tags may be written with or without a leading "v"; builds that aren't for a tag are
      # marked as development builds
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v', 'V')
          } else {
            '999.9.9-ci-${{ github.sha }}'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish app (for the installer)
        run: >
          dotnet publish Afterglow
          -p:Version=${{ steps.version.outputs.value }}
          -p:CSharpier_Bypass=true
          --output Afterglow/bin/publish/
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained

      - name: Publish app (portable, as a single file)
        run: >
          dotnet publish Afterglow
          -p:Version=${{ steps.version.outputs.value }}
          -p:CSharpier_Bypass=true
          -p:PublishSingleFile=true
          --output Afterglow/bin/portable/
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained

      # A portable copy updates itself by replacing its executable, so anything published next to
      # it would never be updated (it has to be bundled into the executable instead)
      - name: Check that the portable app is a single file
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path Afterglow/bin/portable/ -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Afterglow.exe') {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "The portable app must be a single file (Afterglow.exe), but it has $($files.Count)."
          }

      - name: Create installer
        shell: pwsh
        env:
          INSTALLER_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # x64, arm64, or x86, so that each installer only runs where its app can
          $env:INSTALLER_APP_ARCHITECTURE = '${{ matrix.rid }}'.Replace('win-', '')

          choco install innosetup --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path Afterglow/bin/publish/ -Recurse -Destination Installer/Source/

          # Lists the app's files, so that an update can remove those the new version no longer has
          # (plain ASCII, as the installer reads it)
          $source = (Resolve-Path Installer/Source).Path
          Get-ChildItem -Path $source -Recurse -File |
            ForEach-Object { [IO.Path]::GetRelativePath($source, $_.FullName) } |
            Sort-Object |
            Set-Content -Path (Join-Path $source '.files') -Encoding ascii

          # Found rather than assumed, as its folder is named after its major version
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler (ISCC.exe) not found" }

          & $compiler.FullName Installer/Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Move-Item Afterglow/bin/portable/Afterglow.exe packages/Afterglow.${{ matrix.rid }}.exe
          Move-Item Installer/bin/Afterglow-Installer.exe packages/Afterglow-Installer.${{ matrix.rid }}.exe

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Afterglow.${{ matrix.rid }}
          path: packages/
          if-no-files-found: error

  release:
    if: ${{ github.ref_type == 'tag' }}

    needs: pack

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Afterglow.*
          path: packages/
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          packages/*
          --repo ${{ github.repository }}
          --title "Afterglow ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
